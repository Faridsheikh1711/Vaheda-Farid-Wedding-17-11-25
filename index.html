<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>Vaheda & Farid — Our Wedding Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');

:root{
  --ink:#0b0a09;--cream:#f5f0e7;--gold:#c9a45c;--muted:#bcb5aa;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--cream)}
body{font-family:Inter,Arial,sans-serif;overflow-x:hidden}
button{font:inherit}
#intro{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(201,164,92,.12),transparent 30%),
    linear-gradient(145deg,#050505,#171411 65%,#080706);
  transition:opacity .8s ease,visibility .8s ease;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;padding:28px;max-width:760px;animation:rise 1.2s ease both}
.monogram{font-family:"Cormorant Garamond",serif;font-size:54px;letter-spacing:.08em;color:var(--gold);margin-bottom:20px}
.kicker{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#d4cfc6;margin-bottom:18px}
.names{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(62px,13vw,130px);font-weight:300;line-height:.8;letter-spacing:-.035em}
.amp{font-style:italic;color:var(--gold);font-size:.55em}
.date{margin:28px 0 30px;color:var(--muted);font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.open-btn{
  border:1px solid rgba(201,164,92,.7);background:transparent;color:var(--cream);
  padding:13px 27px;letter-spacing:.18em;text-transform:uppercase;font-size:11px;
  cursor:pointer;transition:.3s
}
.open-btn:hover{background:var(--gold);color:#111}
.note{margin-top:16px;font-size:10px;color:#888;letter-spacing:.08em}

main{min-height:100vh;background:
  radial-gradient(circle at 50% 0%,rgba(201,164,92,.07),transparent 35%),
  #0b0a09}
.topbar{
  height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(201,164,92,.18)
}
.brand{font-family:"Cormorant Garamond",serif;font-size:22px;letter-spacing:.08em}
.brand span{color:var(--gold)}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);
  color:var(--cream);border-radius:50%;cursor:pointer
}
.stage{width:min(1200px,94vw);margin:0 auto;padding:24px 0 34px}
.photo-frame{
  position:relative;width:100%;height:min(76vh,780px);min-height:430px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#11100e;border:1px solid rgba(201,164,92,.3);
  box-shadow:0 20px 70px rgba(0,0,0,.5)
}
.photo-frame:before,.photo-frame:after{content:"";position:absolute;z-index:2;pointer-events:none}
.photo-frame:before{inset:14px;border:1px solid rgba(255,255,255,.12)}
.photo-frame:after{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 35%,transparent 65%,rgba(0,0,0,.25))}
#page{
  width:100%;height:100%;object-fit:contain;display:block;
  transition:opacity .42s ease,transform .55s cubic-bezier(.2,.7,.2,1);
}
.turn-out{opacity:0;transform:scale(.985) translateX(22px)}
.caption{
  position:absolute;z-index:4;left:32px;bottom:27px;right:32px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  pointer-events:none
}
.caption-title{font-family:"Cormorant Garamond",serif;font-size:24px;letter-spacing:.04em}
.caption-page{font-size:10px;letter-spacing:.24em;color:#d5cfc4;text-transform:uppercase}
.nav-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px}
.nav-btn{
  border:1px solid rgba(201,164,92,.55);background:transparent;color:var(--cream);
  width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:24px
}
.nav-btn:disabled{opacity:.25;cursor:not-allowed}
.progress{flex:1;max-width:680px;height:2px;background:rgba(255,255,255,.12);position:relative}
.progress i{display:block;height:100%;width:3.85%;background:var(--gold);transition:width .35s ease}
.bottom-row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:17px}
.text-btn{background:none;border:0;color:#aaa49a;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:6px}
.text-btn:hover{color:var(--gold)}
.footer{text-align:center;padding:12px 20px 42px;color:#777066;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.footer .heart{color:var(--gold);font-size:14px;margin:0 4px}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:700px){
  .topbar{height:62px;padding:0 15px}.brand{font-size:19px}
  .stage{width:94vw;padding-top:12px}.photo-frame{height:70vh;min-height:420px}
  .caption{left:20px;right:20px;bottom:20px}.caption-title{font-size:20px}
  .nav-row{gap:10px}.progress{max-width:none}.nav-btn{width:44px;height:44px}
  .names{font-size:clamp(58px,18vw,100px)}
}
</style>
</head>
<body>

<section id="intro" aria-label="Wedding album opening">
  <div class="intro-inner">
    <div class="monogram">V · F</div>
    <div class="kicker">Our Wedding Story</div>
    <div class="names">Vaheda <span class="amp">&amp;</span> Farid</div>
    <div class="date">17 · November · 2025</div>
    <button class="open-btn" id="openAlbum">Open Our Album</button>
    <div class="note" id="introNote">Music will start automatically when your browser allows it.</div>
  </div>
</section>

<main>
  <header class="topbar">
    <div class="brand">V<span>&amp;</span>F</div>
    <div class="top-actions">
      <button class="icon-btn" id="music" aria-label="Play music" title="Music">♪</button>
      <button class="icon-btn" id="full" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    </div>
  </header>

  <section class="stage">
    <div class="photo-frame">
      <img id="page" src="page-01.jpg" alt="Wedding album page">
      <div class="caption">
        <div class="caption-title">Vaheda &amp; Farid</div>
        <div class="caption-page" id="captionPage">01 / 26</div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prev" aria-label="Previous page">‹</button>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <button class="nav-btn" id="next" aria-label="Next page">›</button>
    </div>

    <div class="bottom-row">
      <button class="text-btn" id="playMusic">Play Tenu Leke</button>
      <button class="text-btn" id="auto">Auto Play</button>
    </div>
  </section>

  <div class="footer">A day to remember <span class="heart">♡</span> a lifetime to cherish</div>
</main>

<audio id="audio" src="tenu_leke.mp3" preload="auto" loop></audio>

<script>
const total=26;
let n=1, autoTimer=null;
const img=document.getElementById('page');
const count=document.getElementById('captionPage');
const bar=document.getElementById('bar');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const audio=document.getElementById('audio');
const music=document.getElementById('music');
const playMusic=document.getElementById('playMusic');
const intro=document.getElementById('intro');
const openAlbum=document.getElementById('openAlbum');
const introNote=document.getElementById('introNote');

function update(){
  count.textContent=String(n).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  bar.style.width=(n/total*100)+'%';
  prev.disabled=n===1; next.disabled=n===total;
}
function show(k){
  const nextN=Math.max(1,Math.min(total,k));
  if(nextN===n)return;
  img.classList.add('turn-out');
  setTimeout(()=>{
    n=nextN;
    img.src=`page-${String(n).padStart(2,'0')}.jpg`;
    update();
    requestAnimationFrame(()=>img.classList.remove('turn-out'));
  },230);
}
function hideIntro(){intro.classList.add('hide')}
function setMusicUI(){
  const playing=!audio.paused;
  music.textContent=playing?'❚❚':'♪';
  music.setAttribute('aria-label',playing?'Pause music':'Play music');
  playMusic.textContent=playing?'Pause Tenu Leke':'Play Tenu Leke';
}
async function tryMusic(){
  try{await audio.play();setMusicUI();hideIntro();return true}
  catch(e){return false}
}
async function userMusic(){
  try{await audio.play();setMusicUI();hideIntro()}
  catch(e){}
}
prev.onclick=()=>show(n-1);
next.onclick=()=>show(n+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')show(n-1);
  if(e.key==='ArrowRight')show(n+1);
  if(e.code==='Space'){e.preventDefault();userMusic()}
});
music.onclick=()=>audio.paused?userMusic():(audio.pause(),setMusicUI());
playMusic.onclick=()=>audio.paused?userMusic():(audio.pause(),setMusicUI());
openAlbum.onclick=async()=>{hideIntro();await userMusic()};
audio.addEventListener('play',setMusicUI);
audio.addEventListener('pause',setMusicUI);

let startX=0;
img.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});
img.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dx)>45)show(n+(dx<0?1:-1));
},{passive:true});

document.getElementById('full').onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

document.getElementById('auto').onclick=()=>{
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('auto').textContent='Auto Play'}
  else{
    autoTimer=setInterval(()=>{if(n<total)show(n+1);else{clearInterval(autoTimer);autoTimer=null}},4500);
    document.getElementById('auto').textContent='Stop Auto Play';
  }
};

update();
window.addEventListener('load',()=>{
  setTimeout(async()=>{
    const ok=await tryMusic();
    if(!ok) introNote.textContent='Tap “Open Our Album” to begin the experience.';
  },300);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audio.paused)tryMusic()});
</script>
</body>
</html>
