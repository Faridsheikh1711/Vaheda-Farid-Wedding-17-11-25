<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');
:root{--bg:#080706;--gold:#d3ad67;--gold2:#f0d49a;--ink:#201a13;--muted:#aaa298}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#20170d 0,#0b0907 42%,#050403 100%);color:#eee9df;font-family:Inter,Arial,sans-serif}body{overflow-x:hidden}button{font:inherit}
#cover{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(211,173,103,.17),transparent 28%),linear-gradient(135deg,#050403,#19120b 58%,#050403);transition:opacity .9s,visibility .9s}
#cover.hide{opacity:0;visibility:hidden;pointer-events:none}.cover-card{text-align:center;padding:30px;animation:in 1.1s ease both}.crest{font-family:Georgia,serif;color:var(--gold);letter-spacing:.5em;margin-left:.5em;font-size:18px}.line{width:88px;height:1px;background:var(--gold);margin:20px auto;opacity:.8}.kicker{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:#c8c0b5}.names{font:300 clamp(58px,12vw,132px)/.78 'Cormorant Garamond',Georgia,serif;margin:24px 0 18px}.names em{color:var(--gold);font-style:normal}.date{font-size:11px;letter-spacing:.38em;color:#aaa198}.open{margin-top:35px;padding:14px 31px;border:1px solid rgba(211,173,103,.9);background:linear-gradient(180deg,rgba(211,173,103,.12),transparent);color:#f7f1e6;letter-spacing:.22em;text-transform:uppercase;font-size:10px;cursor:pointer}.open:hover{background:var(--gold);color:#111}.hint{margin-top:12px;color:#756d63;font-size:9px;letter-spacing:.08em}@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(211,173,103,.16)}.logo{font:400 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.15em}.logo b{color:var(--gold);font-weight:400}.tools{display:flex;gap:8px}.tool{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:#ffffff08;color:#eee;cursor:pointer}.tool:hover{border-color:rgba(211,173,103,.7);color:var(--gold2)}
.album{width:min(1220px,95vw);margin:auto;padding:24px 0 32px}.book-wrap{perspective:2800px;display:flex;justify-content:center}.book{position:relative;width:min(1160px,100%);height:min(72vh,720px);min-height:430px;transform-style:preserve-3d;filter:drop-shadow(0 30px 45px rgba(0,0,0,.65))}
/* The permanent two-page spread */
.page{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background:#eee9df;border:1px solid rgba(211,173,103,.38);box-shadow:inset 0 0 28px rgba(0,0,0,.10)}.page img{width:100%;height:100%;display:block;object-fit:contain;background:#eee9df}.left{left:0;border-radius:4px 0 0 4px}.right{right:0;border-radius:0 4px 4px 0}
.gutter{position:absolute;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);z-index:18;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.15) 43%,rgba(0,0,0,.46));box-shadow:0 0 13px rgba(0,0,0,.4)}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent 12%,transparent 88%,rgba(0,0,0,.13))}.left:after{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 18%)}.right:after{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 15%,transparent 88%,rgba(0,0,0,.16))}
/* Page being turned */
.turning{position:absolute;top:0;right:0;width:50%;height:100%;z-index:30;transform-style:preserve-3d;transform-origin:left center;transition:transform 1050ms cubic-bezier(.16,.76,.16,1);display:none}.turning.show{display:block}.turning.flipped{transform:rotateY(-180deg)}.turnface{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#eee9df;border:1px solid rgba(211,173,103,.45)}.turnface img{width:100%;height:100%;object-fit:contain;display:block;background:#eee9df}.turnback{transform:rotateY(180deg)}.turnface:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.30),transparent 35%,rgba(255,255,255,.08) 70%,rgba(0,0,0,.22))}.turn-shadow{position:absolute;top:0;bottom:0;left:49.5%;width:7%;z-index:40;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.28),transparent);filter:blur(3px);opacity:0;transition:opacity .2s}.book.turning-now .turn-shadow{opacity:1}
.credit{position:absolute;right:13px;bottom:13px;z-index:50;padding:7px 10px;border:1px solid rgba(211,173,103,.72);border-radius:4px;background:rgba(13,10,7,.82);box-shadow:0 5px 16px rgba(0,0,0,.3);color:#fff;font-size:10px;line-height:1.45;letter-spacing:.06em;text-align:right;text-shadow:0 1px 2px #000}.credit b{color:var(--gold2);font-weight:600}
.label{text-align:center;margin-top:15px;font-size:10px;letter-spacing:.28em;color:#a9a096;text-transform:uppercase}.controls{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:14px}.arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(211,173,103,.6);background:#ffffff06;color:#eee7db;font-size:28px;cursor:pointer}.arrow:hover:not(:disabled){background:rgba(211,173,103,.13);color:var(--gold2)}.arrow:disabled{opacity:.25;cursor:not-allowed}.track{width:min(610px,50vw);height:2px;background:#ffffff15}.track i{display:block;height:100%;width:7.7%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}.subcontrols{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:11px}.sub{border:0;background:none;color:#9d958b;font-size:9px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:6px}.sub:hover{color:var(--gold2)}.footer{text-align:center;color:#6f6961;font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:4px 20px 28px}.footer span{color:var(--gold);font-size:14px;margin:0 5px}
/* FINAL CREDIT PAGE — one large cinematic page */
.book.final .gutter{display:none}
.book.final .left{display:none}
.book.final .right{left:0;right:auto;width:100%;border-radius:5px;border-color:rgba(211,173,103,.72);box-shadow:0 20px 55px rgba(0,0,0,.55),inset 0 0 45px rgba(0,0,0,.18);background:#090806}
.book.final .right img{width:100%;height:100%;object-fit:cover;background:#090806}
.book.final .right:after{display:none}
.book.final .credit{display:none}
.book.final{animation:finalReveal 1.2s cubic-bezier(.2,.75,.2,1) both}
@keyframes finalReveal{from{opacity:.55;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
@media(max-width:700px){header{height:58px;padding:0 13px}.album{width:97vw;padding-top:12px}.book{height:67vh;min-height:390px}.gutter{width:8px}.credit{font-size:9px;right:8px;bottom:8px;padding:6px 8px}.controls{gap:8px}.arrow{width:44px;height:44px}.track{width:44vw}.names{font-size:clamp(56px,18vw,105px)}}

/* CINEMATIC INSTAGRAM / REEL MODE */
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.38) 100%);mix-blend-mode:multiply}
.album{padding-top:34px}
.book{height:min(70vh,700px);filter:drop-shadow(0 35px 55px rgba(0,0,0,.72));animation:cinematicFloat 7s ease-in-out infinite}
@keyframes cinematicFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.page{background:#090806;border-color:rgba(211,173,103,.32);box-shadow:inset 0 0 45px rgba(0,0,0,.28)}
.page img,.turnface img{background:#090806;object-fit:contain;transform:scale(1.005);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s ease;filter:saturate(1.04) contrast(1.03)}
.book.cinema-pulse .page img{transform:scale(1.025);filter:saturate(1.08) contrast(1.05) brightness(1.03)}
.page:after{background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 14%,transparent 84%,rgba(0,0,0,.16)),linear-gradient(180deg,rgba(255,255,255,.04),transparent 18%,transparent 82%,rgba(0,0,0,.12))}
.gutter{width:15px;background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(255,255,255,.20) 42%,rgba(0,0,0,.68));box-shadow:0 0 22px rgba(0,0,0,.65)}
.turning{transition:transform 1050ms cubic-bezier(.16,.76,.16,1)}
.turnface{background:#090806;border-color:rgba(211,173,103,.34);box-shadow:0 0 30px rgba(0,0,0,.35)}
.turnface img{transition:none}
.turnface:after{background:linear-gradient(90deg,rgba(0,0,0,.46),transparent 30%,rgba(255,255,255,.10) 67%,rgba(0,0,0,.34))}
.turn-shadow{width:10%;filter:blur(7px);background:linear-gradient(90deg,transparent,rgba(0,0,0,.45),transparent)}
.label{letter-spacing:.28em;text-transform:uppercase;color:#c8bba9}
.controls{margin-top:18px}
.arrow{border-color:rgba(211,173,103,.32);box-shadow:0 5px 18px rgba(0,0,0,.22)}
.track{height:2px;background:rgba(255,255,255,.11)}
.track i{background:linear-gradient(90deg,#a47b38,#f0d49a);box-shadow:0 0 10px rgba(240,212,154,.35)}
.sub{border-color:rgba(211,173,103,.22);background:rgba(255,255,255,.035)}
#cover{background:radial-gradient(circle at 50% 45%,rgba(211,173,103,.20),transparent 24%),radial-gradient(circle at 50% 100%,rgba(92,52,18,.20),transparent 45%),linear-gradient(145deg,#030302,#16100a 55%,#050403)}
.cover-card{animation:reelIntro 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes reelIntro{from{opacity:0;transform:scale(.94) translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.names{text-shadow:0 8px 30px rgba(0,0,0,.55)}
.open{box-shadow:0 0 0 rgba(211,173,103,0);transition:.35s}.open:hover{box-shadow:0 0 35px rgba(211,173,103,.25)}
@media(max-width:700px){.book{height:64vh;min-height:370px}.album{padding-top:18px}.gutter{width:7px}.page img{transform:scale(1.002)}}

function pageSound(){try{const a=new Audio(PAPER_SOUND);a.volume=.62;a.play().catch(()=>{});}catch(e){}}
function turn(dir){if(busy)return;if(dir>0&&spread>=27)return;if(dir<0&&spread<=1)return;busy=true;pageSound();book.classList.add('turning-now');if(dir>0){turnFront.src=image(spread+1);turnBack.src=image(spread+2);turning.classList.add('show');requestAnimationFrame(()=>turning.classList.add('flipped'));setTimeout(()=>{spread+=2;turning.classList.remove('flipped');setTimeout(()=>{turning.classList.remove('show');book.classList.remove('turning-now');setSpread();busy=false},60)},900)}else{turnFront.src=image(spread);turnBack.src=image(spread-1);turning.classList.add('show','flipped');requestAnimationFrame(()=>turning.classList.remove('flipped'));setTimeout(()=>{spread-=2;turning.classList.remove('show');book.classList.remove('turning-now');setSpread();busy=false},900)}}
async function musicOn(){try{await audio.play();music.textContent='❚❚';play.textContent='Pause Tenu Leke'}catch(e){}}function musicOff(){audio.pause();music.textContent='♪';play.textContent='Play Tenu Leke'}
next.onclick=()=>turn(1);prev.onclick=()=>turn(-1);music.onclick=()=>audio.paused?musicOn():musicOff();play.onclick=()=>audio.paused?musicOn():musicOff();document.getElementById('open').onclick=async()=>{cover.classList.add('hide');await musicOn()};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.getElementById('auto').onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('auto').textContent='Auto Turn Pages'}else{document.getElementById('auto').textContent='Stop Auto Turn';autoTimer=setInterval(()=>{if(spread<25)turn(1);else{clearInterval(autoTimer);autoTimer=null;document.getElementById('auto').textContent='Auto Turn Pages'}},5200)}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)turn(dx<0?1:-1)},{passive:true});setSpread();
</script></body></html>
